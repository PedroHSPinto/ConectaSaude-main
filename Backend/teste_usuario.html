<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste de Auth - PrintBridge</title>
  <style>
    body { font-family: sans-serif; margin: 30px; display: flex; gap: 20px; }
    .card { background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 8px; width: 300px; }
    input, select, button { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
    button { background: #0070f3; color: white; border: none; cursor: pointer; font-weight: bold; }
    .res { margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>

  <!-- FORMULÁRIO DE CADASTRO -->
  <div class="card">
    <h3>📝 Testar Cadastro</h3>
    <input type="text" id="cadNome" placeholder="Nome Instituição">
    <input type="email" id="cadEmail" placeholder="E-mail">
    <input type="password" id="cadSenha" placeholder="Senha">
    <select id="cadPerfil">
      <option value="cliente">Cliente (AACD)</option>
      <option value="fornecedor">Fornecedor (FabLab)</option>
    </select>
    <input type="text" id="cadCidade" placeholder="Cidade">
    <input type="text" id="cadEstado" placeholder="Estado (ex: SP)">
    <button onclick="cadastrar()">Cadastrar</button>
    <div id="resCad" class="res"></div>
  </div>

  <!-- FORMULÁRIO DE LOGIN -->
  <div class="card">
    <h3>🔑 Testar Login</h3>
    <input type="email" id="loginEmail" placeholder="E-mail">
    <input type="password" id="loginSenha" placeholder="Senha">
    <button onclick="logar()">Entrar</button>
    <div id="resLogin" class="res"></div>
  </div>

  <script>
    const API = 'http://localhost:5000/api/auth';

    async function cadastrar() {
      const body = {
        nomeInstituicao: document.getElementById('cadNome').value,
        email: document.getElementById('cadEmail').value,
        senha: document.getElementById('cadSenha').value,
        perfil: document.getElementById('cadPerfil').value,
        cidade: document.getElementById('cadCidade').value,
        estado: document.getElementById('cadEstado').value
      };

      const res = await fetch(`${API}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      const div = document.getElementById('resCad');
      div.style.background = res.ok ? '#d4edda' : '#f8d7da';
      div.innerHTML = res.ok ? `✅ Criado! ID: ${data.usuario.id}` : `❌ ${data.erro}`;
    }

    async function logar() {
      const body = {
        email: document.getElementById('loginEmail').value,
        senha: document.getElementById('loginSenha').value
      };

      const res = await fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      const div = document.getElementById('resLogin');
      div.style.background = res.ok ? '#d4edda' : '#f8d7da';
      div.innerHTML = res.ok ? `🎉 Bem-vindo, ${data.usuario.nomeInstituicao}!` : `❌ ${data.erro}`;
    }
  </script>
</body>
</html>
